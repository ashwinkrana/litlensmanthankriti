<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LitLens</title>
    <!-- Apply the saved theme and motion choice before the first paint, so a
         light-mode user never sees a dark flash (App.tsx keeps them in sync after). -->
    <script>
      ;(function () {
        var d = document.documentElement, t, m
        try {
          t = localStorage.getItem('litlens-theme')
          m = localStorage.getItem('litlens-motion')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        if (m !== 'on' && m !== 'off') m = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'on'
        d.classList.toggle('dark', t === 'dark')
        d.dataset.theme = t
        d.dataset.motion = m
      })()
    </script>
    <!-- The boot loader: plain HTML + CSS, so it shows while the app's JS and
         fonts download. lib/boot.ts fades it out once the app has painted. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #fff8f5;
        color: #0f172a;
        font: 800 1.125rem/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: -0.02em;
        transition: opacity 0.35s ease, visibility 0.35s;
      }
      .dark #boot {
        background: #0b0f17;
        color: #f8fafc;
      }
      #boot.boot-done {
        opacity: 0;
        visibility: hidden;
      }
      .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.9rem;
      }
      .boot-mark {
        width: 56px;
        height: 56px;
        animation: boot-bob 1.6s ease-in-out infinite;
      }
      .boot-eyes {
        transform-origin: 16px 14.6px;
        animation: boot-blink 3.2s ease-in-out infinite;
      }
      .boot-bar {
        position: relative;
        width: 7rem;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(148, 163, 184, 0.3);
      }
      .boot-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: #fbbf24;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-bob {
        50% { transform: translateY(-4px); }
      }
      @keyframes boot-blink {
        0%, 44%, 52%, 100% { transform: scaleY(1); }
        48% { transform: scaleY(0.12); }
      }
      @keyframes boot-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      html[data-motion='off'] #boot * {
        animation: none !important;
      }
      html[data-motion='off'] .boot-bar::after {
        animation: none;
        width: 100%;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-inner">
        <svg class="boot-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#fbbf24" />
          <g class="boot-eyes">
            <g fill="none" stroke="#0b0f17" stroke-width="2.3" stroke-linecap="round">
              <circle cx="10.2" cy="14.6" r="4.8" />
              <circle cx="21.8" cy="14.6" r="4.8" />
              <path d="M15 13.9c.6-.9 1.4-.9 2 0" />
            </g>
            <path d="M7.9 12.9a2.8 2.8 0 0 1 1.9-1.3M19.5 12.9a2.8 2.8 0 0 1 1.9-1.3" fill="none" stroke="#fff7d6" stroke-width="1.2" stroke-linecap="round" />
          </g>
          <path d="M14.3 20.2h3.4L16 23.6z" fill="#0b0f17" stroke="#0b0f17" stroke-width="1" stroke-linejoin="round" />
        </svg>
        <span>LitLens</span>
        <span class="boot-bar"></span>
        <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading LitLens</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
